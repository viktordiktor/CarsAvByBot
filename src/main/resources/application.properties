spring.application.name=avby

# Render sets PORT=10000; locally the app stays on 8080.
server.port=${PORT:8080}

# Datasource. Without env vars the app uses a local file-based H2 database
# (the data/ directory is created next to the application).
# In production set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD to a
# PostgreSQL connection string (Supabase, Neon, etc.).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/avby;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Keep the pool small: free Postgres plans have a low connection limit and
# Render's free instance does not need many connections.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# av.by client
avby.base-url=https://cars.av.by
avby.request-delay-ms=1200
avby.request-timeout-seconds=30
avby.max-pages-limit=10
# Optional outbound proxy, e.g. http://user:pass@host:8080.
# Override with the AVBY_PROXY_URL environment variable.
avby.proxy-url=
# Optional Playwright fallback for av.by's SafeLine JavaScript challenge.
avby.browser-enabled=${AVBY_BROWSER_ENABLED:false}
avby.browser-timeout-seconds=60

# Scheduler: checks every 30 seconds which profiles are due to be polled.
avby.scheduling.enabled=true
avby.scheduler-tick-ms=30000
