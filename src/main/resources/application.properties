spring.application.name=avby

server.port=8080

# File-based H2 database. The data/ directory is created next to the application.
spring.datasource.url=jdbc:h2:file:./data/avby;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# av.by client
avby.base-url=https://cars.av.by
avby.request-delay-ms=1200
avby.request-timeout-seconds=30
avby.max-pages-limit=10

# Scheduler: checks every 30 seconds which profiles are due to be polled.
avby.scheduling.enabled=true
avby.scheduler-tick-ms=30000
