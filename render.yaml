services:
  - type: web
    name: avby-monitor
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Fill these in the Render dashboard (they are secrets, never commit them).
      # Use the Supabase "Session pooler" connection string, see README.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Optional: route av.by requests through a proxy if the service IP gets
      # challenged by av.by's WAF (HTTP 468). Example: http://user:pass@host:8080
      - key: AVBY_PROXY_URL
        sync: false
      # Use a real browser to pass SafeLine's JavaScript challenge.
      - key: AVBY_BROWSER_ENABLED
        value: "true"
      - key: AVBY_BROWSER_TIMEOUT_SECONDS
        value: "90"
      # Free instance has 512 MB RAM; keep the JVM and Chromium inside that budget.
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms48m -Xmx192m -XX:MaxMetaspaceSize=110m -XX:+UseSerialGC -Xss512k"
      - key: SPRING_THYMELEAF_CACHE
        value: "true"
